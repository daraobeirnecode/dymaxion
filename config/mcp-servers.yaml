# MCP server registry. The runtime spawns each server as a subprocess at
# startup (src/mcp/manager.ts) and supervises it: crash → restart with
# backoff; handshake failure → skill availability degrades, startup continues.

servers:
  - name: esri
    description: Query, edit, and administer ArcGIS Feature Services + Portal
    command: npx
    args: ["-y", "github:daraobeirnecode/esri-mcp"]
    env:
      ESRI_PORTAL_URL: os.environ/ESRI_PORTAL_URL
      ESRI_CLIENT_ID: os.environ/ESRI_CLIENT_ID
      ESRI_CLIENT_SECRET: os.environ/ESRI_CLIENT_SECRET

  - name: postgres
    description: Query and inspect Postgres/PostGIS
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env:
      DATABASE_URL: os.environ/DYMAXION_POSTGIS_URL

  - name: filesystem
    description: Read/write files under the approved workspace
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]

  - name: github
    description: Query GitHub repos for spatial libraries
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: os.environ/GITHUB_TOKEN
