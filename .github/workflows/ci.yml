name: Phase 0 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate patch integrity
        run: git diff --check HEAD^ HEAD

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dymaxion-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dymaxion-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gisbench
      - run: npm run build
      - name: Runtime smoke test
        env:
          DYMAXION_CONFIG_DIR: ../config
          SKILLS_DIR: ../skills
        run: node dist/main.js smoke-test
      - name: Reject moderate, high, or critical production advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build exact runtime production dependency stage
        run: docker build --target production-deps -t dymaxion-runtime-production-deps:ci .
      - name: Audit the dependency tree copied into the runtime image
        run: |
          docker run --rm dymaxion-runtime-production-deps:ci npm audit --omit=dev --audit-level=low
          if docker run --rm dymaxion-runtime-production-deps:ci npm ls @mastra/core; then
            echo '@mastra/core must not be present in the production image tree' >&2
            exit 1
          fi

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dymaxion-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dymaxion-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Reject any production advisory
        run: npm audit --omit=dev --audit-level=low

  windows-worker:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Reject any production advisory
        run: npm audit --omit=dev --audit-level=low

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
