name: Runtime CI

on:
  push:
    paths:
      - 'dymaxion-runtime/**'
      - '.github/workflows/runtime-ci.yml'
  pull_request:
    paths:
      - 'dymaxion-runtime/**'
      - '.github/workflows/runtime-ci.yml'

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dymaxion-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dymaxion-runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Compose configuration
        working-directory: .
        run: docker compose config -q
