slug: feature-layer-publish
name: Feature Layer Publish
version: 0.1.0
description: Publish a local geodataset (GeoPackage, shapefile, or GeoJSON) to an ArcGIS Feature Service with approval and a target folder.
skill_class: workhorse
tools: [esri-mcp, windows-worker]
executor:
  type: python
  entrypoint: executor.py
  runtime: windows-worker
budget:
  max_cost_usd: 0.20
  max_duration_seconds: 300
inputs:
  - name: source_path
    type: string
    required: true
  - name: target_org_url
    type: string
    required: true
  - name: target_folder
    type: string
    required: true
  - name: service_name
    type: string
    required: false
  - name: sharing_level
    type: string
    required: false
outputs:
  - name: service_url
    type: string
  - name: publish_report
    type: object
destructive: true
requires_approval: true
authored_by: dymaxion-core-library
approved_at: '2026-07-14T00:00:00Z'
