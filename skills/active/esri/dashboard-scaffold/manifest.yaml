slug: dashboard-scaffold
name: Dashboard Scaffold
version: 0.1.0
description: Generate an ArcGIS Dashboard configuration from a Feature Service and a list of desired widgets.
skill_class: workhorse
tools: [esri-mcp]
executor:
  type: python
  entrypoint: executor.py
  runtime: dymaxion-runtime
budget:
  max_cost_usd: 0.60
  max_duration_seconds: 300
inputs:
  - name: service_url
    type: string
    required: true
  - name: title
    type: string
    required: true
  - name: widgets
    type: array
    required: true
  - name: target_folder
    type: string
    required: false
outputs:
  - name: dashboard_item_id
    type: string
  - name: dashboard_config
    type: object
destructive: false
requires_approval: false
authored_by: dymaxion-core-library
approved_at: '2026-07-14T00:00:00Z'
