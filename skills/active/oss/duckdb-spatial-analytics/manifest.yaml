    type: string
    required: false
  - name: memory_limit
    type: string
    required: false
outputs:
  - name: result_path
    type: string
  - name: result_preview
    type: array
  - name: stats
    type: object
destructive: false
requires_approval: false
authored_by: dymaxion-core-library
