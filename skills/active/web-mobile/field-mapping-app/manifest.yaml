  - name: output_dir
    type: string
    required: true
  - name: feature_schema
    type: object
    required: true
  - name: sync_target
    type: object
    required: true
  - name: conflict_policy
    type: string
    required: false
  - name: enable_camera
    type: boolean
    required: false
  - name: enable_gps_tracks
    type: boolean
    required: false
  - name: style_url
    type: string
    required: false
outputs:
  - name: project_path
    type: string
  - name: files_created
    type: array
  - name: architecture_notes
    type: string
  - name: sync_endpoint_spec
    type: object
  - name: next_steps
    type: array
destructive: false
requires_approval: false
