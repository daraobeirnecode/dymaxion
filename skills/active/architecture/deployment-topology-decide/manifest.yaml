slug: deployment-topology-decide
name: Deployment Topology Decide
version: 0.1.0
description: 'Given a workload description (client count, data volume, real-time requirements), recommend deployment topology: single VM, Docker Compose, Kubernetes, or serverless.'
skill_class: reasoning
tools: []
executor:
  type: python
  entrypoint: executor.py
  runtime: dymaxion-runtime
budget:
  max_cost_usd: 0.80
  max_duration_seconds: 180
inputs:
  - name: workload_description
    type: string
    required: true
  - name: client_count
    type: number
    required: false
  - name: data_volume_gb
    type: number
    required: false
  - name: realtime_required
    type: boolean
    required: false
  - name: budget_constraint
    type: string
    required: false
outputs:
  - name: architecture_doc
    type: string
  - name: recommended_topology
    type: string
  - name: tradeoffs
    type: array
destructive: false
requires_approval: false
authored_by: dymaxion-core-library
approved_at: '2026-07-14T00:00:00Z'
